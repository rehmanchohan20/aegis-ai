services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d aegis"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    volumes:
      - ml-models:/app/models
    environment:
      AEGIS_MODEL_DEPLOYMENT_APPROVAL_TOKEN: ${AEGIS_MODEL_DEPLOYMENT_APPROVAL_TOKEN}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ml-models:/app/models:ro
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/aegis
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      ML_BASE_URL: http://ml-service:8000
      AEGIS_MODEL_DEPLOYMENT_APPROVAL_TOKEN: ${AEGIS_MODEL_DEPLOYMENT_APPROVAL_TOKEN}
      AEGIS_VIEWER_API_KEY: ${AEGIS_VIEWER_API_KEY}
      AEGIS_ADMIN_API_KEY: ${AEGIS_ADMIN_API_KEY}
      AEGIS_EXECUTION_CONFIRMATION_TOKEN: ${AEGIS_EXECUTION_CONFIRMATION_TOKEN}
      AEGIS_LIVE_EXECUTION_ENABLED: ${AEGIS_LIVE_EXECUTION_ENABLED:-false}
      BINANCE_INGESTION_ENABLED: ${BINANCE_INGESTION_ENABLED:-true}
      AEGIS_MARKET_SYMBOLS: ${AEGIS_MARKET_SYMBOLS:-BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,LINKUSDT}
      AEGIS_MARKET_INTERVALS: ${AEGIS_MARKET_INTERVALS:-1m,3m,5m,15m,1h,4h}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_AEGIS_API_KEY: ${AEGIS_VIEWER_API_KEY}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

volumes:
  db-data:
  ml-models:
  prometheus-data:
