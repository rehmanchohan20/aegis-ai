spring:
  application:
    name: aegis-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aegis}
    username: ${DB_USERNAME:aegis}
    password: ${DB_PASSWORD:aegis}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  level:
    root: INFO
    ai.aegis: ${AEGIS_LOG_LEVEL:INFO}
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

aegis:
  market:
    symbols: ${AEGIS_MARKET_SYMBOLS:BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,LINKUSDT}
    intervals: ${AEGIS_MARKET_INTERVALS:1m,3m,5m,15m,1h,4h}
    snapshot-interval-ms: ${AEGIS_MARKET_SNAPSHOT_INTERVAL_MS:1000}
  security:
    viewer-key: ${AEGIS_VIEWER_API_KEY:local-viewer-change-me}
    admin-key: ${AEGIS_ADMIN_API_KEY:local-admin-change-me}
  binance:
    enabled: ${BINANCE_INGESTION_ENABLED:true}
    stream-url: ${BINANCE_STREAM_URL:}
    rest-url: ${BINANCE_REST_URL:https://api.binance.com}
  automation:
    enabled: ${AEGIS_AUTOMATION_ENABLED:true}
    delay-ms: ${AEGIS_AUTOMATION_DELAY_MS:5000}
  structure:
    delay-ms: ${AEGIS_STRUCTURE_DELAY_MS:15000}
    initial-delay-ms: ${AEGIS_STRUCTURE_INITIAL_DELAY_MS:20000}
  setup:
    timeframes: ${AEGIS_SETUP_TIMEFRAMES:1m,3m,5m,15m}
    delay-ms: ${AEGIS_SETUP_DELAY_MS:15000}
    initial-delay-ms: ${AEGIS_SETUP_INITIAL_DELAY_MS:30000}
  ml:
    base-url: ${ML_BASE_URL:http://localhost:8000}
    deployment-approval-token: ${AEGIS_MODEL_DEPLOYMENT_APPROVAL_TOKEN:DISABLED}
    label-horizon-minutes: ${ML_LABEL_HORIZON_MINUTES:15}
    neutral-return-threshold: ${ML_NEUTRAL_RETURN_THRESHOLD:0.001}
    volatility-label-multiplier: ${ML_VOLATILITY_LABEL_MULTIPLIER:0.50}
    prediction-resolution-delay-ms: ${ML_PREDICTION_RESOLUTION_DELAY_MS:60000}
    model-health-delay-ms: ${ML_MODEL_HEALTH_DELAY_MS:300000}
    health-minimum-sample-size: ${ML_HEALTH_MINIMUM_SAMPLE_SIZE:30}
    promotion:
      minimum-balanced-accuracy: ${ML_PROMOTION_MIN_BALANCED_ACCURACY:0.55}
      minimum-macro-f1: ${ML_PROMOTION_MIN_MACRO_F1:0.50}
      minimum-directional-precision: ${ML_PROMOTION_MIN_DIRECTIONAL_PRECISION:0.52}
      minimum-validation-samples: ${ML_PROMOTION_MIN_VALIDATION_SAMPLES:150}
      maximum-calibration-error: ${ML_PROMOTION_MAX_CALIBRATION_ERROR:0.15}
      minimum-worst-fold-balanced-accuracy: ${ML_PROMOTION_MIN_WORST_FOLD_BALANCED_ACCURACY:0.40}
    label-delay-ms: ${ML_LABEL_DELAY_MS:60000}
  execution:
    live-enabled: ${AEGIS_LIVE_EXECUTION_ENABLED:false}
    confirmation-token: ${AEGIS_EXECUTION_CONFIRMATION_TOKEN:DISABLED}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
