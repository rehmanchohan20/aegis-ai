spring:
  application:
    name: aegis-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aegis}
    username: ${DB_USERNAME:aegis}
    password: ${DB_PASSWORD:aegis}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

aegis:
  binance:
    enabled: ${BINANCE_INGESTION_ENABLED:true}
    stream-url: ${BINANCE_STREAM_URL:wss://stream.binance.com:9443/ws/btcusdt@kline_1m}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics