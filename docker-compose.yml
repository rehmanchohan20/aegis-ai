services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
    ports:
      - "${TIMESCALEDB_HOST_PORT:-5433}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
    ports:
      - "8000:8000"
    volumes:
      - ml-models:/app/models
    environment:
      AEGIS_MODEL_DEPLOYMENT_APPROVAL_TOKEN: ${AEGIS_MODEL_DEPLOYMENT_APPROVAL_TOKEN:-local-model-deployment-approval}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    volumes:
      - ml-models:/app/models:ro
    environment:
      DB_URL: jdbc:postgresql://timescaledb:5432/aegis
      DB_USERNAME: aegis
      DB_PASSWORD: aegis
      ML_BASE_URL: http://ml-service:8000
      AEGIS_MODEL_DEPLOYMENT_APPROVAL_TOKEN: ${AEGIS_MODEL_DEPLOYMENT_APPROVAL_TOKEN:-local-model-deployment-approval}
      AEGIS_VIEWER_API_KEY: ${AEGIS_VIEWER_API_KEY:-local-viewer-change-me}
      AEGIS_ADMIN_API_KEY: ${AEGIS_ADMIN_API_KEY:-local-admin-change-me}
      AEGIS_LIVE_EXECUTION_ENABLED: "false"
      BINANCE_INGESTION_ENABLED: ${BINANCE_INGESTION_ENABLED:-true}
      AEGIS_MARKET_SYMBOLS: ${AEGIS_MARKET_SYMBOLS:-BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,LINKUSDT}
      AEGIS_MARKET_INTERVALS: ${AEGIS_MARKET_INTERVALS:-1m,3m,5m,15m,1h,4h}
    depends_on:
      timescaledb:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_AEGIS_API_KEY: ${AEGIS_VIEWER_API_KEY:-local-viewer-change-me}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  timescale-data:
  redis-data:
  ml-models:
